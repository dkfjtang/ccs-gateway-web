limit_req_zone $binary_remote_addr zone=ccs_gateway_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ccs_gateway_general:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=ccs_gateway_addr:10m;

server {
    listen 0.0.0.0:30033;
    server_name _;

    server_tokens off;
    client_max_body_size 64m;
    client_body_timeout 60s;
    client_header_timeout 15s;
    keepalive_timeout 65s;
    reset_timedout_connection on;

    limit_req_status 429;
    limit_conn_status 429;
    limit_conn ccs_gateway_addr 30;
    limit_req zone=ccs_gateway_general burst=240 nodelay;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    if ($request_uri ~* "(^https?://|169\.254\.169\.254|100\.100\.100\.200|metadata\.google\.internal)") {
        return 444;
    }

    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    location = /api/auth/login {
        limit_req zone=ccs_gateway_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:17666;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Server $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Scheme $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
        proxy_redirect off;
    }

    location /api/ws {
        proxy_pass http://127.0.0.1:17666;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Server $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Scheme $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
        proxy_redirect off;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:17666;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Server $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Scheme $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
        proxy_redirect off;
    }
}

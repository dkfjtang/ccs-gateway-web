services:
  ccs-gateway-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: ccs-gateway-web:local
    container_name: ccs-gateway-web
    restart: unless-stopped
    environment:
      CC_SWITCH_HOST: 0.0.0.0
      CC_SWITCH_PORT: 17666
      CC_SWITCH_AUTO_PORT: "false"
      RUST_LOG: cc_switch_server=info,tower_http=info
    ports:
      - "127.0.0.1:17666:17666"
